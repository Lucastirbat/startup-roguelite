server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Godot web export types
    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream pck;
        image/png png;
        image/svg+xml svg;
    }

    gzip on;
    gzip_types application/javascript application/wasm application/octet-stream;
    gzip_min_length 1024;

    # Godot exports don't version filenames, so everything must revalidate:
    # ETag makes unchanged files a cheap 304, changed files always fresh.
    location / {
        add_header Cache-Control "no-cache";
        etag on;
        try_files $uri $uri/ =404;
    }
}
